const q=document.getElementById('q'), country=document.getElementById('country'), status=document.getElementById('status');
const stats=document.getElementById('stats'), results=document.getElementById('results');
const countries=[...new Set(DATA.map(x=>x.country).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
countries.forEach(x=>{let o=document.createElement('option');o.value=x;o.textContent=x;country.appendChild(o)});
[...new Set(DATA.map(x=>x.status).filter(Boolean))].sort().forEach(x=>{let o=document.createElement('option');o.value=x;o.textContent=x;status.appendChild(o)});

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function highlight(s,term){
  s=esc(s); if(!term) return s;
  const re=new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig');
  return s.replace(re,m=>'<mark>'+m+'</mark>');
}
function search(){
 const term=q.value.trim(), lc=term.toLowerCase(), c=country.value, st=status.value;
 let out=DATA.filter(x=>(!c||x.country===c)&&(!st||x.status===st));
 if(lc) out=out.filter(x=>[x.country,x.territory,x.territoryName,x.code,x.location,x.status].join(' ').toLowerCase().includes(lc));
 stats.textContent=term ? `${out.length} fund` : `${DATA.length} poster i databasen`;
 if(!out.length){results.innerHTML='<div class="empty">Ingen resultater.</div>';return}
 const max=300;
 results.innerHTML=out.slice(0,max).map(x=>`
 <div class="result">
   <span class="badge">${esc(x.country)}</span><span class="badge">Række ${x.row}</span>
   <div class="code">${highlight(x.code,term)}</div>
   <div class="location">${highlight(x.location,term)}</div>
   <div class="details">
    <div class="detail"><b>Territory:</b> ${highlight(x.territory,term)}</div>
    <div class="detail"><b>Status:</b> ${highlight(x.status,term)}</div>
   </div>
 </div>`).join('') + (out.length>max?`<div class="empty">Viser de første ${max} resultater.</div>`:'');
}
q.addEventListener('input',search); country.addEventListener('change',search); status.addEventListener('change',search);
document.getElementById('clear').onclick=()=>{q.value='';country.value='';status.value='';search();q.focus()};
search();
</script>
